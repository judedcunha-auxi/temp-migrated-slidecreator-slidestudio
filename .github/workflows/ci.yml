name: CI
#
# The same workflow, job and step names as every Python service repo (repo
# standards, "Testing and CI"), modeled on Auxi_Connector's ci.yml, so everyone can
# find the same step in the same place. scripts/gate.py runs the same checks
# locally, in the same order.
#
# Python is pinned to 3.11, the Azure runtime (PYTHON:3.11), so a CI pass means the
# same interpreter version as production. ruff, mypy and pytest settings live in
# pyproject.toml, so a local run gives the same result as CI.
#
# Not carried over from the connector: its Redis service container and its
# integration suites (this service's tests use fakeredis), and its frontend job.

# Every push to every branch, every pull request, and a manual run: no branch can be
# merged or deployed from code CI has not seen. Only the deploy artifact and the
# deploy jobs are limited to the two deploy branches, staging and production.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Nothing here writes to the repository; a dependency's install script then cannot either.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest + ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # The secret scan reads the full git history, not just this commit.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        id: setup-python
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        id: install-dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # The export engine measures slides in a real browser (app/engine/extract). Playwright's
      # bundled Chromium, at the version requirements.txt pins, with its system libraries; plus
      # the metric-compatible fonts the container ships (docs/deployment.md): Carlito for
      # Calibri, Liberation for Arial / Times New Roman / Courier New, DejaVu as the last resort.
      - name: Install Playwright Chromium and fonts
        id: install-browser
        run: |
          python -m playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends fonts-crosextra-carlito fonts-liberation fonts-dejavu-core

      - name: Verify dependency set is consistent
        id: dependency-check
        run: pip check

      # The real app graph must import: every router registers and create_app()
      # runs. Static analysis never executes module-level code; this does.
      - name: Import smoke test (app boots)
        id: import-smoke-test
        run: python -c "import app.main"

      - name: Unit tests
        id: unit-tests
        run: pytest tests -v --junitxml=ci-reports/unit.xml

      - name: Lint (ruff)
        id: lint
        run: ruff check app/ tests/

      - name: Type check (mypy)
        id: type-check
        run: mypy -p app

      # A finding FAILS the run on purpose: a signal that cannot fail is decoration.
      # Accept a false positive deliberately, with `--ignore-vuln <id>` and a reason.
      - name: Dependency audit (pip-audit)
        id: dependency-audit
        run: |
          mkdir -p ci-reports
          pip-audit -r requirements.txt -f json -o ci-reports/pip-audit.json

      # gitleaks over the full history. The binary is pinned and checksum-verified
      # rather than using gitleaks-action, which needs a paid licence for an
      # organisation account.
      - name: Secret scan (gitleaks)
        id: secret-scan
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --no-banner --verbose .

      - name: Static security scan (bandit)
        id: static-security-scan
        run: bandit -r app

      # What ran, what it found and what it cost, on the run page. Runs even when a step failed.
      - name: Job summary
        if: always()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
          RUNTIME_VERSION: Python ${{ steps.setup-python.outputs.python-version }}
        run: python scripts/ci_summary.py backend >> "$GITHUB_STEP_SUMMARY"

  # One immutable, SHA-addressed deploy artifact per green push to a deploy branch:
  # built from the exact commit CI just tested, never from someone's working tree,
  # and carrying build_info.json (dirty is false by construction) for /healthz.
  package:
    name: Deploy artifact (SHA-addressed)
    needs: [backend]
    if: >-
      github.event_name == 'push' &&
      contains(fromJSON('["staging","production"]'), github.ref_name)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build the deploy package
        run: python scripts/package_deploy.py

      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-${{ github.sha }}
          path: staging-deploy.zip
          retention-days: 30
          if-no-files-found: error

      - name: Job summary
        run: |
          {
            echo "## Deploy artifact"
            echo
            echo "**deploy-${GITHUB_SHA}** · $(du -h staging-deploy.zip | cut -f1) · built from commit ${GITHUB_SHA::7} · kept 30 days"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # TODO(D2, D18, D19): the two deploy jobs below are STUBS and never run
  # (`if: false`). They are filled in when these are decided:
  #   D2  hosting: App Service for Containers (recommended, because the engine
  #       needs Chromium), Container Apps, or zip deploy; and the slot model.
  #   D18 secrets in Azure: Key Vault references + managed identity (recommended).
  #   D19 GitHub to Azure credentials: OIDC (recommended). That job then needs
  #       `permissions: id-token: write` and the azure/login action.
  # Each deploys the artifact built above (deploy-${{ github.sha }}), never a
  # rebuild, and then runs `python scripts/verify_deploy.py <target> --sha
  # ${{ github.sha }}`, which fails the job unless /readyz is healthy and /healthz
  # reports this exact commit. See docs/deployment.md.
  # ---------------------------------------------------------------------------
  deploy-staging:
    name: Deploy to staging
    needs: [package]
    if: false && github.event_name == 'push' && github.ref_name == 'staging'
    runs-on: ubuntu-latest
    environment: staging
    env:
      SLIDEFORGE_STAGING_URL: ${{ vars.SLIDEFORGE_STAGING_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download the artifact
        uses: actions/download-artifact@v4
        with:
          name: deploy-${{ github.sha }}

      - name: Deploy to the staging slot
        run: |
          echo "TODO(D2/D18/D19): deploy staging-deploy.zip to the staging slot"
          exit 1

      - name: Verify deploy
        run: python scripts/verify_deploy.py staging --sha "${GITHUB_SHA}"

  deploy-production:
    name: Deploy to production
    needs: [package]
    if: false && github.event_name == 'push' && github.ref_name == 'production'
    runs-on: ubuntu-latest
    environment: production
    env:
      SLIDEFORGE_PRODUCTION_URL: ${{ vars.SLIDEFORGE_PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download the artifact
        uses: actions/download-artifact@v4
        with:
          name: deploy-${{ github.sha }}

      - name: Deploy to production
        run: |
          echo "TODO(D2/D18/D19): deploy staging-deploy.zip to production"
          exit 1

      - name: Verify deploy
        run: python scripts/verify_deploy.py production --sha "${GITHUB_SHA}"
