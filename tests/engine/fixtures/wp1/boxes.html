<!doctype html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:transparent;
  font-family:Arial,Helvetica,sans-serif;color:#2E2E38}
.b{position:absolute;box-sizing:border-box}

#solid{left:40px;top:40px;width:160px;height:80px;background:#1A9AFA}
#alpha{left:220px;top:40px;width:160px;height:80px;background:rgba(26,154,250,.4)}
#radius{left:400px;top:40px;width:160px;height:80px;background:#2E2E38;border-radius:12px 4px 12px 4px}
#uniform{left:580px;top:40px;width:160px;height:80px;border:4px solid #2DB757}
#sides{left:760px;top:40px;width:160px;height:80px;border:1px solid #E6E6EC;border-top:3px solid #1A9AFA}
#dashed{left:940px;top:40px;width:160px;height:80px;border:2px dashed #747480}

#lgrad{left:40px;top:160px;width:160px;height:80px;background:linear-gradient(135deg,#1A9AFA 0%,#2E2E38 100%)}
#lgrad2{left:220px;top:160px;width:160px;height:80px;background:linear-gradient(to right,#FFE600,#FF4136)}
#rgrad{left:400px;top:160px;width:160px;height:80px;background:radial-gradient(circle,#FFFFFF,#1A9AFA)}
#shadow{left:580px;top:160px;width:160px;height:80px;background:#FFFFFF;box-shadow:0 4px 12px rgba(0,0,0,.25)}
#faded{left:760px;top:160px;width:160px;height:80px;background:#2E2E38;opacity:.5}
#clipped{left:940px;top:160px;width:160px;height:80px;background:#2DB757;
  clip-path:polygon(0% 0%, 100% 0%, 50% 100%)}

/* overflow: hidden clips the child shape */
#clipper{left:40px;top:300px;width:120px;height:60px;overflow:hidden;background:#F6F6FA}
#clipper .inner{position:absolute;left:40px;top:20px;width:200px;height:200px;background:#FF4136}

/* a group of two shapes */
#group{left:220px;top:300px;width:220px;height:60px}
#group .g1{position:absolute;left:0;top:0;width:100px;height:60px;background:#C4C4CD}
#group .g2{position:absolute;left:110px;top:0;width:100px;height:60px;background:#747480}

/* forced raster over a red sibling — the isolation test */
#red{left:520px;top:300px;width:120px;height:60px;background:#FF0000}
#blurred{left:560px;top:310px;width:60px;height:40px;background:#0000FF;filter:blur(3px)}

/* z-index paints the later sibling behind the earlier one */
#zback{left:700px;top:300px;width:100px;height:60px;background:#111111;z-index:2}
#zfront{left:740px;top:320px;width:100px;height:60px;background:#EEEEEE;z-index:1}

/* the rest of the raster-only list from the authoring contract */
#conic{left:40px;top:400px;width:100px;height:60px;background:conic-gradient(#1A9AFA,#FFE600)}
#layers{left:180px;top:400px;width:100px;height:60px;
  background:linear-gradient(#1A9AFA,#1A9AFA),linear-gradient(#FFE600,#FFE600)}
#blend{left:320px;top:400px;width:100px;height:60px;background:#1A9AFA;mix-blend-mode:multiply}
#inset{left:460px;top:400px;width:100px;height:60px;background:#FFFFFF;box-shadow:inset 0 2px 6px rgba(0,0,0,.4)}
#forced{left:600px;top:400px;width:100px;height:60px;background:#2DB757}
#scaled{left:740px;top:400px;width:100px;height:60px;background:#C4C4CD;transform:scale(2)}

/* scale(-1) is the one mirror the contract allows: a flip, not a rotation */
#mirror{left:900px;top:400px;width:100px;height:60px;background:#747480;transform:scale(-1,1)}

/* a raster inside a rotated ancestor: the capture must not bake the rotation in twice */
#turned{left:1060px;top:400px;width:120px;height:60px;transform:rotate(30deg)}
#turned .fx{position:absolute;left:10px;top:10px;width:60px;height:40px;background:#2DB757;filter:blur(2px)}
</style></head><body>
<div class="b" id="solid"></div>
<div class="b" id="alpha"></div>
<div class="b" id="radius"></div>
<div class="b" id="uniform"></div>
<div class="b" id="sides"></div>
<div class="b" id="dashed"></div>

<div class="b" id="lgrad"></div>
<div class="b" id="lgrad2"></div>
<div class="b" id="rgrad"></div>
<div class="b" id="shadow"></div>
<div class="b" id="faded"></div>
<div class="b" id="clipped"></div>

<div class="b" id="clipper"><div class="inner"></div></div>
<div class="b" id="group" data-pptx="group" data-name="pair"><div class="g1"></div><div class="g2"></div></div>

<div class="b" id="red"></div>
<div class="b" id="blurred"></div>

<div class="b" id="zback"></div>
<div class="b" id="zfront"></div>

<div class="b" id="conic"></div>
<div class="b" id="layers"></div>
<div class="b" id="blend"></div>
<div class="b" id="inset"></div>
<div class="b" id="forced" data-pptx="raster"></div>
<div class="b" id="scaled"></div>
<div class="b" id="mirror"></div>
<div class="b" id="turned"><div class="fx" id="turnedfx"></div></div>
</body></html>
