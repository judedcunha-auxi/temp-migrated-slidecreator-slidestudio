<!doctype html>
<!--
  Torture family: svg-charts (owner WP3c).

  Eight hand-drawn figures the recogniser must judge: six it must turn into native charts, two it
  must refuse. Everything is authored under docs/engine/03-AUTHORING-CONTRACT.md — no scripts, no
  remote resources, theme fonts only — and every SVG is drawn 1:1 (viewBox == width/height) so one
  SVG user unit is one canvas pixel and the geometry below is also the IR's geometry.

  The numbers are chosen so the scales are exact: panel A 1.6 px/unit, B 1 px/unit, C 2 px/unit,
  D 0.5 px/unit, F 2 px/unit. A recogniser that reads the drawing correctly reproduces the data
  exactly; one that rounds sloppily does not.

  Panel G and panel H exist to be refused. G has no numbers anywhere. H has only annotations
  ("FY27E", "350→420k", "n/a") — strings the numeric grammar must reject. Both must stay as shapes
  with an `info` diagnostic: never guess values (90-CRITIQUE.md #10).
-->
<html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:transparent;
  font-family:Arial,Helvetica,sans-serif;color:#2E2E38}
.title{position:absolute;left:16px;top:12px;width:1248px;font-size:16px;line-height:20px;font-weight:bold}
.panel{position:absolute;width:300px;height:300px}
.ph{font-size:12px;line-height:16px;font-weight:bold;margin:0 0 8px 0}
</style></head><body>

<div class="title">SVG chart recogniser — six charts to catch, two to refuse</div>

      <rect x="244" y="56"  width="22" height="144" fill="#1A9AFA"/>

    <g font-size="8" fill="#2E2E38" text-anchor="middle" font-weight="bold">
      <text x="53"  y="132">40</text><text x="75"  y="108">55</text>
